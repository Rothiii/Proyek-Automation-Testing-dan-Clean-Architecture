name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecret
          POSTGRES_DB: forumapi_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5433
      PGUSER: developer
      PGPASSWORD: supersecret
      PGDATABASE: forumapi_test
      ACCESS_TOKEN_KEY: supersecret

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa gaya penulisan kode
        run: npm run lint

      - name: Jalankan migrasi basis data pengujian
        run: npm run migrate:test up

      - name: Jalankan pengujian dengan cakupan kode
        run: npm run test:coverage

      - name: Unggah laporan cakupan kode
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
